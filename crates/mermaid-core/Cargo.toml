[package]
name = "mermaid-core"
version.workspace = true
edition.workspace = true

[features]
default = []
wasm = ["chrono/wasmbind"]

[dependencies]
pest = "2.7"
pest_derive = "2.7"
petgraph = "0.8"
ab_glyph = "0.2"
chrono = "0.4"
thiserror.workspace = true
log.workspace = true
resvg = "0.44"
png = "0.17"

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "flowchart_bench"
harness = false

[[bench]]
name = "sequence_bench"
harness = false

[[bench]]
name = "gantt_bench"
harness = false
