[package]
name = "mermaid-core"
description = "Pure-Rust Mermaid diagram parser and SVG/PNG renderer — no browser, no Node"
keywords = ["mermaid", "diagram", "svg", "flowchart", "sequence"]
categories = ["visualization", "parser-implementations", "rendering", "graphics"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
default = ["png", "ascii"]
wasm = ["chrono/wasmbind"]
png = ["dep:resvg", "dep:png"]
ascii = []

[dependencies]
pest = "2.7"
pest_derive = "2.7"
petgraph = "0.8"
dagre-rust = { package = "mermaid-dagre", version = "0.1.1", path = "../dagre-rust" }
ab_glyph = "0.2"
chrono = "0.4"
thiserror.workspace = true
log.workspace = true
resvg = { version = "0.47", optional = true }
png = { version = "0.18", optional = true }

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "flowchart_bench"
harness = false

[[bench]]
name = "sequence_bench"
harness = false

[[bench]]
name = "gantt_bench"
harness = false
