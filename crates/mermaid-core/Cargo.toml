[package]
name = "mermaid-core"
version.workspace = true
edition.workspace = true

[features]
default = ["png"]
wasm = ["chrono/wasmbind"]
png = ["dep:resvg", "dep:png"]

[dependencies]
pest = "2.7"
pest_derive = "2.7"
petgraph = "0.8"
dagre-rust = { path = "../dagre-rust" }
ab_glyph = "0.2"
chrono = "0.4"
thiserror.workspace = true
log.workspace = true
resvg = { version = "0.44", optional = true }
png = { version = "0.17", optional = true }

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "flowchart_bench"
harness = false

[[bench]]
name = "sequence_bench"
harness = false

[[bench]]
name = "gantt_bench"
harness = false
