[package]
name = "mermaid-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mermaid-core = { path = "../mermaid-core", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
