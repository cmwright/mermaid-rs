[package]
name = "mermaid-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mermaid"
path = "src/main.rs"

[features]
default = ["ascii"]
ascii = ["mermaid-core/ascii"]

[dependencies]
mermaid-core = { path = "../mermaid-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
env_logger = "0.11"
log.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
