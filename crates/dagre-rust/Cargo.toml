[package]
name = "dagre-rust"
version = "0.1.0"
edition = "2024"
description = "A 1:1 Rust port of the dagre JavaScript graph layout library"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
ahash = "0.8.12"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "layout_bench"
harness = false