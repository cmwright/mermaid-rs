[package]
name = "mermaid-dagre"
description = "A 1:1 Rust port of the dagre JavaScript graph layout library — backs mermaid-core"
keywords = ["graph", "layout", "dagre", "hierarchical", "dag"]
categories = ["algorithms", "visualization"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

[lib]
name = "dagre_rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
ahash = "0.8.12"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "layout_bench"
harness = false
