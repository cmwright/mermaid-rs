[package]
name = "mermaid-rs"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = [
    "crates/mermaid-core",
    "crates/mermaid-cli",
    "crates/dagre-rust",
]
exclude = ["crates/mermaid-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
thiserror = "2"
log = "0.4"

[dev-dependencies]
mermaid-core = { path = "crates/mermaid-core" }
